<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F4C81"/>
      <stop offset="100%" stop-color="#0B3A63"/>
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#grid)"/>
  <g transform="translate(600 300)" opacity="0.18">
    <circle r="180" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <circle r="120" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle r="60" fill="none" stroke="#FFFFFF" stroke-width="1"/>
  </g>
</svg>